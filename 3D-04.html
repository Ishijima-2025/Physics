<p class="X-Large-Bold-RED">斜め上から波形を描画する方法-04</p>
<p class="Large-Bold-Red">&nbsp;</p>
<p class="Large-Bold-Red">XY平面</p>
<p> XY面を考えます（真上から見た様子）． </p>
<p><img src="3D-04.png" width="561" height="801" /></p>
<p>図のように，Lの値はｘの位置によって決まります．</p>
<p>\(\Large L = x  sin \varphi　\)</p>
<p>なので，前ページのｙ'は，</p>
<p>\(\Large y' = 
( M  - y +  z sin \theta) \ cos \theta - x sin \varphi sin \theta \)</p>
<p>と補正されることがわかります．</p>
<p>次ページに，	<span class="X-Large-Blue">ｘ'方向</span>を考えていきましょう．</p>
