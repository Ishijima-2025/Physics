<p class="Large-Bold-Red">XY平面（	Z方向に<span class="X-Large-Bold-RED">オフセットがない</span>場合）</p>
<p> XY面を考えます（真上から見た様子）． </p>
<p><img src="3D-04.png" width="561" height="801" /></p>
<p>図のように，観察平面上でのｘ’の位置は，</p>
<p>\(\Large x' = x  cos \varphi　\)</p>
<p>となります．観察平面上でのｘ’方向の位置は観察平面の傾き，θ，には依存しないから簡単ですね．</p>
