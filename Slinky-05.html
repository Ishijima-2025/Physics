<p class="X-Large-RED"><strong>バネの自由落下における最下端の位置変化について，計算</strong>-4</p>
<p class="Large-Bold-Blue">・　静止したバネを自由落下させた場合</p>
<p>バネから手を外した直後にバネの最下端は静止し，いずれ落下していくので，静止しているかどうかの計算はごくごく初期の時間を計算すればいいこととなります．</p>
<p>ct &lt; x &lt; L，の場合，</p>
<p><img src="Slinky-25.gif" width="450" height="240" /></p>
<p>から，</p>
<p><img src="Slinky-26.gif" width="807" height="542" /></p>
<p>となって，初期値と同じことがわかります．<br />
つまり，位置が変化しない，こととなります（ct=Lまで）．</p>
<p>無事，計算できました！</p>
