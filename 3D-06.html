<p class="X-Large-Bold-RED">斜め上から波形を描画する方法-06</p>
<p class="Large-Bold-Red">&nbsp;</p>
<p class="Large-Bold-Red">XY平面（	Z方向に<span class="X-Large-Bold-RED">オフセットがある</span>場合）</p>
<p> XY面を考えます（真上から見た様子）． </p>
<p><img src="3D-05.png" width="561" height="801" /></p>
<p>Z方向が０でない場合，ｘ’’だけｘの値が大きくなるので，</p>
<p>\(\Large x'' = z \ tan \varphi　\)</p>
<p>となります．従って，</p>
<p>\(\Large \begin{eqnarray}    x' &amp;=&amp; (x + z tan \varphi) cos \varphi \\<br />
&amp;=&amp; x cos \varphi + z sin \varphi \\ <br />
\end{eqnarray}　\)　</p>
<p>となります．</p>
