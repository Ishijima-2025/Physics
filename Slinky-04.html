<p class="X-Large-RED"><strong>バネの自由落下における最下端の位置変化について，計算</strong>-3</p>
<p class="Large-Bold-Blue">・　静止したバネを自由落下させた場合</p>
<p>バネの波動方程式は，</p>
<p><img src="Slinky-17.gif" width="217" height="87" /></p>
<p>となります．ここで，境界条件は両端ともに自由端であるので，</p>
<p><img src="Slinky-18.gif" width="297" height="87" /></p>
<p>です．初期条件は先に示したように，</p>
<p><img src="Slinky-19.gif" width="275" height="80" /></p>
<p>となります．ここで，</p>
<p><img src="Slinky-20.gif" width="300" height="77" /></p>
<p>とおくと，</p>
<p><img src="Slinky-21.gif" width="270" height="400" /></p>
<p>と置き換えることができます． 境界条件は，u(x,t)と同じ， </p>
<p><img src="Slinky-22.gif" width="390" height="170" /></p>
<p>です．</p>
<p>ここで，<a href="Slinky-04-2.html">ここ</a>にあるように，</p>
<p><img src="Slinky-23.gif" width="435" height="77" /></p>
<p>を元に２L周期の偶関数を作ると，</p>
<p><img src="Slinky-24.gif" width="450" height="130" /></p>
<p>を得ることができます．</p>
<p>さあ，大詰めです．</p>
